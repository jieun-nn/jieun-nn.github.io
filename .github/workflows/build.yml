name: 허브 갱신

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 한국시간 자정
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/summaries.json", "data/config.json", "build.py"]

permissions:
  contents: write

concurrency:
  group: hub-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 폰트·Pillow 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q pillow
      - name: RSS 읽어서 사이트 생성
        run: python build.py
      - name: 바뀐 내용 커밋
        run: |
          git config user.name "jingni-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "허브 자동 갱신 $(date -u +%F)" && git push; fi
